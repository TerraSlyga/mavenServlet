<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вхід до системи</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 420px; padding: 20px; background-color: #f8f9fa; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #007bff; outline: none; }
        .btn-submit { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background-color: #0056b3; }
        .alert { padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 14px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .footer-links { margin-top: 20px; text-align: center; font-size: 14px; }
        .footer-links a { color: #007bff; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Вхід до системи</h2>

        <!-- Повідомлення про помилку -->
        <div th:if="${param.error != null or errorMessage != null}" class="alert alert-danger" id="error-alert">
            <span th:text="${errorMessage != null ? errorMessage : 'Невірний логін або пароль.'}">Невірний логін або пароль.</span>
        </div>

        <!-- Повідомлення про успішний вихід -->
        <div th:if="${param.logout != null or infoMessage != null}" class="alert alert-info" id="logout-alert">
            <span th:text="${infoMessage != null ? infoMessage : 'Ви успішно вийшли із системи.'}">Ви успішно вийшли із системи.</span>
        </div>

        <!-- Повідомлення про успішну реєстрацію чи підтвердження -->
        <div th:if="${param.registered != null or param.confirmed != null or successMessage != null}" class="alert alert-success" id="success-alert">
            <span th:if="${param.registered != null}">Реєстрація успішна! Перевірте пошту для активації акаунту.</span>
            <span th:if="${param.confirmed != null}">Акаунт успішно активовано! Тепер ви можете увійти.</span>
            <span th:if="${successMessage != null and param.registered == null and param.confirmed == null}" th:text="${successMessage}">Повідомлення</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Логін:</label>
                <input type="text" id="username" name="username" placeholder="Введіть логін" required autofocus />
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введіть пароль" required />
            </div>

            <button type="submit" class="btn-submit">Увійти</button>
        </form>

        <div class="footer-links">
            Немає акаунту? <a th:href="@{/register}">Зареєструватися</a>
        </div>
    </div>
</body>
</html>
