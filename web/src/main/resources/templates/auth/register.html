<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація нового користувача</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 420px; padding: 20px; background-color: #f8f9fa; }
        .register-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus { border-color: #28a745; outline: none; }
        .btn-submit { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background-color: #218838; }
        .alert { padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 14px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .footer-links { margin-top: 20px; text-align: center; font-size: 14px; }
        .footer-links a { color: #007bff; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>Реєстрація</h2>

        <div th:if="${errorMessage != null}" class="alert alert-danger" id="error-alert">
            <span th:text="${errorMessage}">Помилка</span>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">Логін:</label>
                <input type="text" id="username" name="username" placeholder="Введіть бажаний логін" required autofocus />
            </div>

            <div class="form-group">
                <label for="email">E-mail (для підтвердження):</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" />
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введіть пароль" required />
            </div>

            <button type="submit" class="btn-submit">Зареєструватися</button>
        </form>

        <div class="footer-links">
            Вже маєте акаунт? <a th:href="@{/login}">Увійти</a>
        </div>
    </div>
</body>
</html>
