<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>
    <header th:fragment="header" class="main-header">
        <div class="header-container">
            <h1 class="brand" th:text="#{app.title}">Каталог книг</h1>
            <nav class="nav-links">
                <a th:href="@{/books}" th:text="#{nav.books}">Список книг</a> |
                <a th:href="@{/books/add}" th:text="#{nav.add}">Додати книгу</a>
            </nav>
            <div class="lang-switcher">
                <span th:text="#{nav.lang}">Мова:</span>
                <a href="?lang=uk" th:text="#{nav.lang.uk}">Українська</a> |
                <a href="?lang=en" th:text="#{nav.lang.en}">English</a>
            </div>
        </div>
        <hr/>
    </header>
</body>
</html>
