<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{form.title}">Додавання нової книги</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .main-header { margin-bottom: 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        .nav-links a, .lang-switcher a { margin: 0 5px; text-decoration: none; color: #0066cc; }
        .nav-links a:hover, .lang-switcher a:hover { text-decoration: underline; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button, .btn-submit { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover, .btn-submit:hover { background-color: #0056b3; }
        .btn-back { margin-left: 10px; color: #6c757d; text-decoration: none; }
        .btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div th:replace="fragments/header :: header"></div>

    <h2 th:text="#{form.title}">Додавання нової книги</h2>

    <form th:action="@{/books/add}" th:object="${book}" method="post">
        <div class="form-group">
            <label for="title" th:text="#{form.field.title}">Назва книги:</label>
            <input type="text" id="title" th:field="*{title}" th:placeholder="#{form.placeholder.title}" required />
        </div>

        <div class="form-group">
            <label for="author" th:text="#{form.field.author}">Автор:</label>
            <input type="text" id="author" th:field="*{author}" th:placeholder="#{form.placeholder.author}" required />
        </div>

        <div class="form-group">
            <label for="pubYear" th:text="#{form.field.year}">Рік видання:</label>
            <input type="number" id="pubYear" th:field="*{pubYear}" th:placeholder="#{form.placeholder.year}" required />
        </div>

        <div class="form-group">
            <button type="submit" class="btn-submit" th:text="#{form.add}">Додати</button>
            <a th:href="@{/books}" class="btn-back" th:text="#{form.back}">Назад до списку</a>
        </div>
    </form>
</body>
</html>
