# ===============================================
# Spring Boot Application Configuration
# ===============================================

# App name
spring.application.name=Book Catalog Application

# Server port
server.port=8080

# Bean overriding
spring.main.allow-bean-definition-overriding=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===============================================
# Custom Application Parameters
# ===============================================
app.description=Spring Boot REST API for book catalog and comments
app.version=2.0.0
app.default-page-size=10
app.max-page-size=100
app.welcome-message=Welcome to Spring Boot Book Catalog!

# ===============================================
# Mail Configuration (Gmail SMTP)
# ===============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ВАШ_GMAIL_ЛОГІН
spring.mail.password=ВАШ_16_СИМВОЛЬНИЙ_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# FreeMarker
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8
