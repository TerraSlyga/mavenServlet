# ===============================================
# Spring Boot Application Configuration
# ===============================================

# App name
spring.application.name=Book Catalog Application

# Server port
server.port=8080

# Bean overriding
spring.main.allow-bean-definition-overriding=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===============================================
# Custom Application Parameters
# ===============================================
app.description=Spring Boot REST API for book catalog and comments
app.version=2.0.0
app.default-page-size=10
app.max-page-size=100
app.welcome-message=Welcome to Spring Boot Book Catalog!
