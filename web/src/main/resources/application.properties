# ===============================================
# Spring Boot Application Configuration
# ===============================================

# App name
spring.application.name=Book Catalog Application

# Server port
server.port=8080

# Bean overriding
spring.main.allow-bean-definition-overriding=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===============================================
# Custom Application Parameters
# ===============================================
app.description=Spring Boot REST API for book catalog and comments
app.version=2.0.0
app.default-page-size=10
app.max-page-size=100
app.welcome-message=Welcome to Spring Boot Book Catalog!

# ===============================================
# Mail Configuration (Gmail SMTP)
# ===============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=terraslyga2004@gmail.com
spring.mail.password=nwfhmmpcodcojeqi

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ===============================================
# Database (H2) Configuration
# ===============================================
spring.datasource.url=jdbc:h2:file:./data/guest;AUTO_SERVER=TRUE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===============================================
# Flyway Migration Configuration
# ===============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================================
# FreeMarker Configuration
# ===============================================
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8
spring.freemarker.suffix=.ftl
spring.freemarker.check-template-location=false
